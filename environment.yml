name: gkmqc

dependencies:
  - pip
  # Floor, not a pin: conda resolves to the newest compatible Python.
  # 3.10 is the oldest release the current dependency stack installs on.
  - python>=3.10
  - bitarray
  - numpy
  - scikit-learn
  - matplotlib
  - scipy
  - pip:
      # pyfasta (the previous FASTA reader) is unmaintained Python-2
      # code; pyfaidx is the maintained equivalent and a drop-in for
      # the one call site this project uses.
      - pyfaidx
